<!doctype html>
<html lang="nb" data-mantine-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bygdø Badmintonklubb</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Badminton for alle på Bygdøhus i Oslo. Trening, medlemskap, arrangementer og nyheter fra Bygdø Badmintonklubb."
    />
    <meta property="og:site_name" content="Bygdø Badmintonklubb" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bygdø Badmintonklubb" />
    <meta
      property="og:description"
      content="Badminton for alle på Bygdøhus i Oslo. Trening, medlemskap, arrangementer og nyheter fra Bygdø Badmintonklubb."
    />
    <meta property="og:image" content="https://bygdobk.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://cdn.sanity.io" />
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('bygdo-settings'))?.state ?? {};
        const scheme = s.colorScheme ?? 'auto';
        const root = document.documentElement;
        const dark = scheme === 'dark' || (scheme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.mantineColorScheme = dark ? 'dark' : 'light';
      } catch {}
      try {
        const fromPath = location.pathname.split('/')[1];
        const chosen = JSON.parse(localStorage.getItem('bygdo-locale'))?.state?.chosen;
        const lang = ['en', 'sv', 'da', 'fi', 'is', 'zh'].includes(fromPath) ? fromPath : (chosen ?? 'nb');
        document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
