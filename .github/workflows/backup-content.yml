name: Back up editor content

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: printf 'VITE_SANITY_PROJECT_ID=psw4r05b\nVITE_SANITY_DATASET=production\n' > .env
      - run: pnpm exec sanity dataset export production content.tar.gz --no-drafts --overwrite
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_BACKUP_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: content-${{ github.run_number }}
          path: content.tar.gz
          retention-days: 90
